services:
  cachepanel:
    build: .
    # Or, once published: image: ghcr.io/<you>/cachepanel:latest
    container_name: cachepanel
    restart: unless-stopped
    ports:
      - "8090:8000"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/stacks/steam-prefill/config:/opt/stacks/steam-prefill/config
      - /opt/stacks/battlenet-prefill/config:/opt/stacks/battlenet-prefill/config
      - /opt/stacks/epic-prefill/config:/opt/stacks/epic-prefill/config
      - /mnt/lancache/logs:/mnt/lancache/logs:ro
      - ./data:/data
