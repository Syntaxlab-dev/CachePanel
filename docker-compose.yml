services:
  cachepanel:
    build: .
    # Or, to skip the local build: image: ghcr.io/syntaxlab-dev/cachepanel:latest
    # (published automatically on every push to main, see README's Setup section)
    container_name: cachepanel
    restart: unless-stopped
    ports:
      - "8090:8000"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/stacks/steam-prefill/config:/opt/stacks/steam-prefill/config
      - /opt/stacks/battlenet-prefill/config:/opt/stacks/battlenet-prefill/config
      - /opt/stacks/epic-prefill/config:/opt/stacks/epic-prefill/config
      - /mnt/lancache/logs:/mnt/lancache/logs:ro
      - ./data:/data

  # Optional, only started with `docker compose --profile postgres up -d`.
  # Only useful together with a matching DATABASE_URL in .env (pointing at
  # this service's hostname, "postgres") -- see the README's "Optional:
  # PostgreSQL" section. Without --profile postgres, `docker compose up -d`
  # behaves exactly as before this: just the cachepanel container, JSON
  # files under ./data.
  postgres:
    image: postgres:16-alpine
    container_name: cachepanel-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: cachepanel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: cachepanel
    volumes:
      - ./pgdata:/var/lib/postgresql/data
